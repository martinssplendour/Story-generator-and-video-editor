<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>__TITLE__ starter card</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          box-sizing: border-box;
          overflow: hidden;
          padding: 128px 92px;
          color: #fff8fd;
          background:
            radial-gradient(circle at 18% 20%, rgba(238, 78, 150, 0.34), transparent 34%),
            radial-gradient(circle at 82% 78%, rgba(127, 88, 255, 0.28), transparent 38%),
            linear-gradient(160deg, #1a0a23 0%, #100817 55%, #09050e 100%);
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #starter-card-content {
          width: 100%;
          box-sizing: border-box;
          padding: 72px 58px;
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 48px;
          background: rgba(255, 255, 255, 0.08);
          box-shadow: 0 36px 100px rgba(0, 0, 0, 0.32);
          text-align: center;
        }

        #starter-card-eyebrow {
          margin: 0 0 28px;
          color: #ff9bc8;
          font-size: 30px;
          font-weight: 750;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        #starter-card-title {
          margin: 0;
          font-size: 92px;
          line-height: 0.98;
          letter-spacing: -0.055em;
        }

        #starter-card-status {
          max-width: 760px;
          margin: 34px auto 0;
          color: rgba(255, 248, 253, 0.74);
          font-size: 34px;
          line-height: 1.35;
        }
      </style>

      <div id="root" data-composition-id="starter-card" data-width="1080" data-height="1920" data-duration="5">
        <div id="starter-card-content">
          <p id="starter-card-eyebrow">Splendoure story</p>
          <h1 id="starter-card-title">__TITLE__</h1>
          <p id="starter-card-status">Replace this starter after the concept and storyboard are approved.</p>
        </div>
      </div>

      <script>
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(
          "#starter-card-content",
          { y: 36, opacity: 0.55 },
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          0,
        );
        window.__timelines["starter-card"] = timeline;
      </script>
    </template>
  </body>
</html>
